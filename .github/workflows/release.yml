name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  id-token: write   # OIDC token for nuget.org trusted publishing

jobs:
  release:
    name: Build, test and release
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore VCWpfControls.slnx

      # TreatWarningsAsErrors=true comes from Directory.Build.props.
      - name: Build (Release)
        run: dotnet build VCWpfControls.slnx -c Release --no-restore

      - name: Unit tests (Core.Tests)
        run: >
          dotnet test tests/VCWpfControls.Core.Tests/VCWpfControls.Core.Tests.csproj
          -c Release --no-build

      - name: Control tests (STA)
        run: >
          dotnet test tests/VCWpfControls.Control.Tests/VCWpfControls.Control.Tests.csproj
          -c Release --no-build

      # UI tests (FlaUI) are intentionally skipped on tag builds.

      - name: Pack
        run: >
          dotnet pack src/VCWpfControls/VCWpfControls.csproj
          -c Release -o artifacts/package

      # Fail fast if VersionPrefix in Directory.Build.props was not bumped to the tag:
      # nuget.org would reject the duplicate and --skip-duplicate would hide it.
      - name: Verify package version matches tag
        shell: pwsh
        run: |
          $tagVersion = $env:GITHUB_REF_NAME.TrimStart('v')
          $expected = "artifacts/package/VCWpfControls.$tagVersion.nupkg"
          if (-not (Test-Path $expected)) {
            $built = (Get-ChildItem artifacts/package -Filter *.nupkg | Select-Object -ExpandProperty Name) -join ', '
            Write-Error "Expected $expected but built: $built. Bump VersionPrefix in Directory.Build.props to $tagVersion."
            exit 1
          }

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            artifacts/package/*.nupkg
            artifacts/package/*.snupkg

      # TODO: Enable this step after registering an API key on nuget.org
      # and storing it in the repository secret NUGET_API_KEY
      # (remove `if: false` below).
      - name: NuGet login (trusted publishing)
        uses: NuGet/login@v1
        id: nuget-login
        with:
          user: NovikovDevOpnSrc

      - name: Publish to NuGet.org
        shell: pwsh
        env:
          NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
        run: |
          Get-ChildItem artifacts/package -Filter *.nupkg | ForEach-Object {
            dotnet nuget push $_.FullName --api-key $env:NUGET_API_KEY --source https://api.nuget.org/v3/index.json --skip-duplicate
          }
